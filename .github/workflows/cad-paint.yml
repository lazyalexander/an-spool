name: Mature CAD spool
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: lazyalexander/an-loom
          ref: d38b1bdc865c209197cd54f7f101f91c9cac7ff5
          path: .local/loom
          persist-credentials: false
      - run: cargo build --manifest-path .local/loom/Cargo.toml --locked --bin an-loom
      - working-directory: spools/cad-paint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --only-binary=:all: drjit==1.5.0 mitsuba==3.9.1 numpy==2.3.5 pillow==12.3.0
          python -B -m unittest discover -s tests -v
          python -B pack-client.py --loom ../../.local/loom/target/debug/an-loom --tsc node_modules/.bin/tsc --output releases --check
      - name: Mechanical source releases and render gates
        run: |
          python -B -m unittest discover -s spools/mechanical-film/source -p 'test_*.py' -v
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, subprocess
          loom = str(Path('.local/loom/target/debug/an-loom').resolve())
          for item in json.loads(Path('teaching-releases.json').read_text())['releases']:
              archive = Path(item['distribution'])
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == item['distribution_sha256']
              verified = json.loads(subprocess.check_output([loom, 'verify', str(archive)], text=True))
              assert verified['releaseDigest'] == item['release_digest']
              packed = json.loads(subprocess.check_output([loom, 'pack', item['source']], text=True))
              assert Path(packed['archive']).read_bytes() == archive.read_bytes()
          PYCODE
      - name: Steam mechanism domain checks
        working-directory: spools/mechanism/source/production-mechanics-v2
        run: |
          PYTHONPATH=src python -B tools/build_delivery.py
          PYTHONPATH=src python -B -m unittest discover -s tests -v
      - name: Native teaching envelopes reproduce
        run: |
          python -B examples/mechanical-animation/product/pack.py .local/native-a
          python -B examples/mechanical-animation/product/pack.py .local/native-b
          node --check examples/mechanical-animation/product/app.js
          python -B examples/mechanical-animation/product/product.py --help
          python -B examples/mechanical-animation/product/qualify.py --help
          python - <<'PYCODE'
          from pathlib import Path
          a, b = Path('.local/native-a'), Path('.local/native-b')
          files = lambda root: {p.relative_to(root): p.read_bytes() for p in root.rglob('*') if p.is_file()}
          assert files(a) == files(b)
          PYCODE
      - name: Document domain and reproducible native client
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r spools/documents/requirements.txt
          python -B -m unittest discover -s spools/documents/tests -v
          python -B - <<'PYCODE'
          from pathlib import Path
          import json, subprocess
          loom = str(Path('.local/loom/target/debug/an-loom').resolve())
          subprocess.run([loom, 'check', 'spools/documents'], check=True)
          a = json.loads(subprocess.check_output([loom, 'pack', 'spools/documents'], text=True))['archive']
          before = Path(a).read_bytes()
          b = json.loads(subprocess.check_output([loom, 'pack', 'spools/documents'], text=True))['archive']
          assert before == Path(b).read_bytes()
          subprocess.run([loom, 'verify', a], check=True)
          for name in ('a', 'b'):
              subprocess.run([loom, 'export-native-spool-v3', a, '.local/documents-client-' + name], check=True)
          files = lambda root: {p.relative_to(root): p.read_bytes() for p in root.rglob('*') if p.is_file()}
          assert files(Path('.local/documents-client-a')) == files(Path('.local/documents-client-b'))
          PYCODE
